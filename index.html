<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贪吃蛇 · 手机版</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1726;color:#eaf6ff;font-family:system-ui;min-height:100dvh;display:grid;place-items:center;padding:15px}.wrap{width:min(100%,440px)}h1{text-align:center;margin:10px}.stats{display:flex;gap:10px;margin:14px 0}.stats div{flex:1;background:#23354a;border-radius:12px;padding:10px;text-align:center}b{font-size:23px}canvas{width:100%;aspect-ratio:1;display:block;border-radius:15px;border:2px solid #47637b;touch-action:none}button{background:#34d399;border:0;border-radius:12px;padding:12px;color:#05291c;font-size:18px;font-weight:700}.pad{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:7px;margin:14px}.pad button{background:#314b64;color:white;height:52px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.actions{display:flex;gap:10px}.actions button{flex:1}#status{text-align:center;min-height:25px;margin:12px;color:#b9e7da}.hint{font-size:12px;color:#9aafc1;text-align:center}</style></head><body><main class="wrap"><h1>🐍 贪吃蛇</h1><div class="stats"><div>当前得分<br><b id="score">0</b></div><div>最高纪录<br><b id="best">0</b></div></div><canvas id="game" width="400" height="400"></canvas><div id="status">点击开始游戏</div><div class="pad"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div><div class="actions"><button id="start">开始 / 重开</button><button id="pause">暂停 / 继续</button></div><p class="hint">滑动屏幕或点击方向键控制，电脑支持方向键 / WASD</p></main><script>(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),status=document.querySelector('#status');let snake=[[9,10],[8,10],[7,10]],food=[14,10],dir=[1,0],next=[1,0],score=0,best=0,timer=null,playing=false,paused=false;try{best=Number(localStorage.getItem('snake-best'))||0}catch{}bestEl.textContent=best;const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};function newFood(){const a=[];for(let y=0;y<20;y++)for(let x=0;x<20;x++)if(!snake.some(p=>p[0]===x&&p[1]===y))a.push([x,y]);return a.length?a[Math.floor(Math.random()*a.length)]:null}function draw(){for(let y=0;y<20;y++)for(let x=0;x<20;x++){g.fillStyle=(x+y)%2?'#182e45':'#1d354c';g.fillRect(x*20,y*20,20,20)}if(food){g.fillStyle='#fb7185';g.beginPath();g.arc(food[0]*20+10,food[1]*20+10,7,0,7);g.fill()}snake.forEach((p,i)=>{g.fillStyle=i?'#34d399':'#a7f3d0';g.fillRect(p[0]*20+2,p[1]*20+2,16,16)});if(paused){g.fillStyle='#06101acb';g.fillRect(0,0,400,400);g.fillStyle='white';g.textAlign='center';g.font='bold 30px system-ui';g.fillText('已暂停',200,200)}}function tick(){dir=next;const h=[snake[0][0]+dir[0],snake[0][1]+dir[1]],eat=food&&h[0]===food[0]&&h[1]===food[1];if(h.some(v=>v<0||v>=20)||(eat?snake:snake.slice(0,-1)).some(p=>p[0]===h[0]&&p[1]===h[1])){clearInterval(timer);playing=false;status.textContent='游戏结束，得分 '+score+'，点击重新开始';return}snake.unshift(h);if(eat){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snake-best',String(best))}catch{}}food=newFood();if(!food){clearInterval(timer);playing=false;status.textContent='恭喜通关！';draw();return}schedule()}else snake.pop();draw()}function schedule(){clearInterval(timer);timer=setInterval(tick,Math.max(80,170-Math.floor(score/5)*12))}function start(){snake=[[9,10],[8,10],[7,10]];dir=next=[1,0];food=newFood();score=0;scoreEl.textContent=0;playing=true;paused=false;status.textContent='吃掉红色食物，避开边界和自己';schedule();draw()}function turn(k){const d=dirs[k];if(!d||!playing||paused||d[0]===-dir[0]&&d[1]===-dir[1])return;next=d}document.querySelector('#start').onclick=start;document.querySelector('#pause').onclick=()=>{if(!playing)return;paused=!paused;if(paused){clearInterval(timer);status.textContent='已暂停'}else{schedule();status.textContent='继续游戏'}draw()};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(b.dataset.dir));document.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(k){e.preventDefault();turn(k)}else if(e.code==='Space'){e.preventDefault();document.querySelector('#pause').click()}});let touch;c.addEventListener('touchstart',e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});c.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');touch=null},{passive:true});draw()})();</script></body></html>
